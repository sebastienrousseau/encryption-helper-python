[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "encryption-helper"
version = "0.0.2"
description = "A Python library and CLI for generating, protecting and using asymmetric key pairs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HSBC Open Source", email = "opensource@hsbc.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HSBC Open Source", email = "opensource@hsbc.com" }]
keywords = [
    "rsa",
    "ed25519",
    "ecdsa",
    "keys",
    "keypair",
    "cryptography",
    "encryption",
    "decryption",
    "signing",
    "cli",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# ML-KEM (FIPS 203) and ML-DSA (FIPS 204) require cryptography 46 or
# newer. The upper bound keeps a major release from landing untested;
# Renovate raises it deliberately rather than by accident.
dependencies = ["cryptography>=46.0.0,<51.0.0"]

[project.urls]
Homepage = "https://github.com/hsbc/encryption-helper-python"
Repository = "https://github.com/hsbc/encryption-helper-python"
Issues = "https://github.com/hsbc/encryption-helper-python/issues"
Changelog = "https://github.com/hsbc/encryption-helper-python/blob/main/CHANGELOG.md"

[project.scripts]
encryption-helper = "encryption_helper.cli:main"

[tool.poetry]
packages = [{ include = "encryption_helper" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.2"
pytest-cov = ">=5.0.0"
hypothesis = ">=6.100.0"
# tomllib is stdlib from 3.11; the docs-accuracy test needs a reader on 3.10.
tomli = { version = ">=2.0.0", python = "<3.11" }
ruff = ">=0.6.0"
mypy = ">=1.11.0"
bandit = ">=1.7.9"
pre-commit = ">=3.8.0"

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "encryption_helper"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # Run the docstring examples. Documentation that is never executed drifts:
    # a corrupted set of doctest examples shipped in this package precisely
    # because nothing ran them.
    "--doctest-modules",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["encryption_helper"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    # Only reached when the module is run as a script, which the CLI tests
    # cover via a real subprocess that in-process coverage cannot see.
    'if __name__ == "__main__":',
]

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Security scanning
# ---------------------------------------------------------------------------

[tool.bandit]
# Config lives here rather than in .bandit.yml so there is one place to look.
#
# Two changes from the previous setup. First, bandit is actually invoked by CI
# now -- .bandit.yml existed but no workflow ever ran it. Second, the B101
# (assert_used) skip is gone, so the package source is scanned with the full
# ruleset. The test suite is covered instead by ruff's flake8-bandit rules
# (the "S" selection above), which understand that `assert` is what a test is
# for; running bandit over tests would only produce ~185 B101 findings.
exclude_dirs = [".git", ".venv", "build", "dist", "tests"]

# ---------------------------------------------------------------------------
# Linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["encryption_helper", "tests", "packages/encryption-helper-mcp"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Conflicts with the formatter.
    "ISC001",
    # `Any` is required where we accept arbitrary key types from `cryptography`.
    "ANN401",
    # We document raised exceptions in prose, not with a strict raise-vs-doc check.
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place presentation belongs, so printing is expected.
"encryption_helper/cli/*" = ["T201"]
# Examples, benchmarks and fuzz harnesses are standalone scripts. Printing is
# their entire output mechanism, and they are executed rather than imported.
"examples/**" = ["T201", "INP001", "S101", "PLR2004"]
"benches/**" = ["T201", "INP001"]
# Release-audit and mutation tooling. The mutation table embeds exact
# source snippets, which cannot be wrapped without breaking the match.
"scripts/**" = ["T201", "INP001", "TRY300", "E501", "PLR0911"]
# `atheris` is imported lazily and inside a function: it is an optional
# fuzzing engine, and the module must remain importable without it.
"fuzz/**" = ["T201", "INP001", "S101", "PLC0415"]
# Tests are linted with the same ruleset as the source, minus a short list of
# relaxations that are idiomatic in a test suite. This is deliberately narrow:
# the previous configuration excluded `tests/*` from flake8 entirely and set
# `disable=all` for pylint, which is how a completely broken code path shipped
# with a clean lint report.
"tests/**" = [
    "ANN",     # Test functions do not need annotations.
    "ARG",     # Fixtures are often accepted for their side effects.
    "D",       # Test names document themselves.
    "EM101",   # Throwaway stubs may raise literals.
    "PLC0415", # Function-local imports keep a test's dependencies visible.
    "PLR2004", # Comparing against literal expected values is the point.
    "S101",    # `assert` is how tests assert.
    "S105",    # Test passphrases are not real credentials.
    "S106",
    "S607",    # Calling `git` and `ssh-keygen` by name is intended.
]
# Companion distributions under `packages/` are linted with the same rules as
# the core package, including the same test relaxations. The list is repeated
# rather than globbed because `tests/**` does not match a nested path.
"packages/*/tests/**" = [
    "ANN",
    "ARG",
    "D",
    "EM101",
    "PLC0415",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "S607",
    "SLF001",  # Asserting on a server's private dispatch table is the point.
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
