name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@e7aeea1772ec01da74cafda11c5caa463520ca59 # v3
        with:
          fail-on-severity: moderate
          # This project's LICENSE is unresolved (see IMPLEMENTATION_PLAN C1);
          # tighten this list once it is settled.
          deny-licenses: AGPL-3.0, GPL-3.0
