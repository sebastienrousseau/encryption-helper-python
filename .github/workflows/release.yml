name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# What a release must prove before anything reaches PyPI:
#
#   ci       the full CI suite passes on the tagged commit itself. A tag can
#            point at any commit, including one CI never saw.
#   build    the tag matches the package version, and the wheel is built by
#            tools installed from hashes. They run in the job that produces
#            the artifact, so an unpinned upstream release could otherwise
#            alter the wheel before it is attested.
#   sbom     describes the package -- the wheel and its install closure --
#            not the runner. Kept out of dist/, which is published verbatim.
#   publish  attests and uploads exactly the artifacts `build` produced.
#
# Also configure, in the repository settings: required reviewers on the
# `pypi` environment, and a tag protection rule for v*. Neither can be
# expressed in this file.

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install release tooling from hashes
        run: python -m pip install --require-hashes -r requirements/release.txt
      - name: The tag must match the package version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"tag {tag} matches version {version}")
          PY
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution
          path: dist/

  sbom:
    name: SBOM
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution
          path: dist/
      # A venv holding only the built wheel and what pip resolves for it:
      # exactly what a user's `pip install encryption-helper` produces.
      # Created without pip, so pip itself is not listed as a component.
      - name: Generate CycloneDX SBOM for the wheel
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install dist/*.whl
          mkdir -p sbom
          python -m cyclonedx_py environment \
            --mc-type library \
            --output-format JSON \
            --output-file sbom/encryption-helper.cdx.json \
            "$RUNNER_TEMP/sbom-env/bin/python"
      - name: Verify the SBOM describes the package
        run: |
          python - <<'PY'
          import json, sys
          names = {c["name"] for c in json.load(open("sbom/encryption-helper.cdx.json"))["components"]}
          missing = {"encryption-helper", "cryptography"} - names
          if missing:
              sys.exit(f"SBOM is missing {sorted(missing)}")
          print(f"SBOM components: {sorted(names)}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted Publishing: no long-lived API token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/p/encryption-helper
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution
          path: dist/
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
