name: Bug report
description: Something does not behave as documented.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **If this is a security vulnerability, stop and use
        [private reporting](https://github.com/hsbc/encryption-helper-python/security/advisories/new)
        instead.** Anything involving key exposure, weak parameters, or file
        permissions is a security issue.

  - type: checkboxes
    id: not-security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I have redacted all real keys, passphrases and secrets below.
          required: true

  - type: input
    id: version
    attributes:
      label: encryption-helper version
      placeholder: "0.1.0 (encryption-helper --version)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12.4, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the full error output, with secrets redacted.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        A minimal command or snippet. Generate a throwaway key rather than
        using a real one.
      render: shell
    validations:
      required: true
